<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Help School</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #5a67d8;
        }

        .error {
            color: #e53e3e;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .info {
            margin-top: 20px;
            padding: 10px;
            background: #f7fafc;
            border-radius: 5px;
            font-size: 12px;
        }

        .info p {
            margin: 5px 0;
            color: #666;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <h1>📊 Help School</h1>
        <div class="subtitle">Sistema de Acompanhamento Escolar</div>

        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required value="admin@escola.com">
            </div>

            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="senha" required value="123456">
            </div>

            <button type="submit">Entrar</button>

            <div id="error" class="error"></div>

            <div class="info">
                <p><strong>Credenciais de teste:</strong></p>
                <p>Coordenador: admin@escola.com / 123456</p>
                <p>Professor: joao@escola.com / 123456</p>
                <p>Direção: diretora@escola.com / 123456</p>
            </div>
        </form>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const errorDiv = document.getElementById('error');

            errorDiv.textContent = '';

            const result = await login(email, senha);

            if (result.success) {
                window.location.href = 'index.html';
            } else {
                errorDiv.textContent = result.error || 'Erro ao fazer login';
            }
        });
    </script>
</body>

</html>
